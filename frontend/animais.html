<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Animais | Patas & Cia.</title>
  </head>
  <body>
    <!-- Navegação lateral -->
    <aside>
      <nav>
        <a href="index.html">
          <img src="assets/icones/home.svg" alt="home" />
        </a>
        <a href="animais.html" class="ativo">
          <img src="assets/icones/paw.svg" alt="Ícone de pata" />
        </a>
        <a href="tutores.html">
          <img
            src="assets/icones/users-group.svg"
            alt="Ícone grupo de pessoas"
          />
        </a>
      </nav>
    </aside>
    <!-- Conteúdo principal -->
    <main>
      <header>
        <h1>Animais Cadastrados</h1>
      </header>
      <!-- Cabeçalho da listagem -->
      <div class="cabecalho-lista">
        <section class="h2-lista">
          <div>
            <h2>Lista de animais</h2>
          </div>
        </section>
        <section class="descricao">
          <div>
            <p>Consulte e gerencie os animais cadastrados na clínica.</p>
          </div>
        </section>
        <section class="botao-cadastrar">
          <button type="button" id="btn-novo-animal">Cadastrar pet</button>
        </section>
      </div>
      <!-- Fórmulario cadastro animal -->
      <dialog id="modal-animal">
        <h2>Cadastrar pet</h2>

        <form id="form-animal">
          <label for="nome-animal">Nome</label>
          <input
            type="text"
            id="nome-animal"
            placeholder="Digite o nome do animal"
            required
          />

          <label for="especie-animal">Espécie</label>
          <input
            type="text"
            id="especie-animal"
            placeholder="Digite a espécie do animal"
            required
          />

          <label for="raca-animal">Raça</label>
          <input
            type="text"
            id="raca-animal"
            placeholder="Digite a raca do animal"
          />

          <label for="dataNascimento-animal">Data de nascimento</label>
          <input
            type="date"
            id="dataNascimento-animal"
            placeholder="Digite o a data de nascimento do animal"
          />

          <label for="tutor-animal">Tutor</label>
          <select id="tutor-animal" required>
            <option value="" selected disabled>Selecione um tutor</option>
          </select>

          <button type="button" id="btn-cancelar-animal">Cancelar</button>
          <button type="submit">Cadastrar</button>
        </form>
      </dialog>
      <!-- Tabela de animais -->
      <section class="tabela">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Espécie</th>
              <th>Raça</th>
              <th>Data de nascimento</th>
              <th>Tutor</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="lista-animais"></tbody>
        </table>
      </section>
    </main>
    <!-- Scripts da página -->
    <script src="js/animais.js"></script>
  </body>
</html>
