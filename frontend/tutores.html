<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Tutores | Patas & Cia.</title>
  </head>
  <body>
    <!-- Navegação lateral -->
    <aside>
      <nav>
        <a href="index.html">
          <img src="assets/icones/home.svg" alt="home" />
        </a>
        <a href="animais.html">
          <img src="assets/icones/paw.svg" alt="Ícone de pata" />
        </a>
        <a href="tutores.html" class="ativo">
          <img
            src="assets/icones/users-group.svg"
            alt="Ícone grupo de pessoas"
          />
        </a>
      </nav>
    </aside>

    <!-- Conteúdo principal -->
    <main>
      <header>
        <h1>Tutores Cadastrados</h1>
      </header>

      <!-- Cabeçalho da listagem -->
      <div class="cabecalho-lista">
        <section class="h2-lista">
          <div>
            <h2>Lista de tutores</h2>
          </div>
        </section>
        <section class="descricao">
          <div>
            <p>Consulte e gerencie os tutores cadastrados na clínica.</p>
          </div>
        </section>
        <section class="botao-cadastrar">
          <button type="button" id="btn-novo-tutor">Cadastrar tutor</button>
        </section>
      </div>
      <!-- Fórmulario cadastro tutor -->
      <dialog id="modal-tutor">
        <h2>Cadastrar tutor</h2>

        <form id="form-tutor">
          <label for="nome-tutor">Nome</label>
          <input
            type="text"
            id="nome-tutor"
            placeholder="Digite o nome completo"
            required
          />

          <label for="telefone-tutor">Telefone</label>
          <input
            type="tel"
            id="telefone-tutor"
            placeholder="Digite o telefone para contato"
            required
          />

          <label for="email-tutor">E-mail</label>
          <input type="email" id="email-tutor" placeholder="Digite o E-mail" />

          <label for="endereco-tutor">Endereço</label>
          <input
            type="text"
            id="endereco-tutor"
            placeholder="Digite o endereço"
          />

          <button type="button" id="btn-cancelar-tutor">Cancelar</button>
          <button type="submit">Cadastrar</button>
        </form>
      </dialog>

      <!-- Campo de busca -->
      <div class="busca">
        <label for="busca-tutores">Buscar tutor</label>
        <input
          type="text"
          id="busca-tutores"
          placeholder="Buscar tutor pelo nome..."
          autocomplete="off"
        />
      </div>
      <!-- Tabela de tutores -->
      <section class="tabela">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Telefone</th>
              <th>E-mail</th>
              <th>Endereço</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="lista-tutores"></tbody>
        </table>
      </section>
    </main>

    <!-- Scripts da página -->
    <script src="js/tutores.js"></script>
  </body>
</html>
